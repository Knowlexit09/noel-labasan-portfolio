    <g transform="translate(1065 408)">
      <path d="M0 48Q0 0 48 0h230q48 0 48 48v438q0 44-44 44H44Q0 530 0 486z" fill="#8b4626" stroke="#b86738" stroke-width="3"/>
      <rect x="22" y="31" width="282" height="11" rx="6" fill="#6d361f"/>
      <circle cx="163" cy="152" r="51" fill="none" stroke="#f0a173" stroke-width="13" stroke-dasharray="246 74" transform="rotate(-28 163 152)"/>
      <path d="M138 154c14-15 33-19 50-10 1 20-13 37-34 37-15 0-26-9-26-20 0-2 4-4 10-7z" fill="none" stroke="#fff2e5" stroke-width="8"/>
      <text x="163" y="238" text-anchor="middle" fill="#fff6ed" font-family="Arial Black,Arial" font-size="28" font-weight="900">QYNTRO DAILY</text>
      <text x="163" y="270" text-anchor="middle" fill="#ffe4d1" font-family="Arial" font-size="15" font-weight="700" letter-spacing="7">COFFEE</text>
      <text x="163" y="351" text-anchor="middle" fill="#fff8ef" font-family="Arial" font-size="22" font-weight="800">HOUSE BLEND</text>
      <text x="163" y="381" text-anchor="middle" fill="#f4d4c0" font-family="Arial" font-size="15">Balanced &amp; Smooth</text>
      <text x="163" y="496" text-anchor="middle" fill="#ffe5d3" font-family="Arial" font-size="14">250g</text>
    </g>

    <g transform="translate(1380 438)">
      <path d="M0 43Q0 0 43 0h185q43 0 43 43v393q0 40-40 40H40Q0 476 0 436z" fill="url(#creamBag)" stroke="#c59d7d" stroke-width="3"/>
      <rect x="20" y="28" width="231" height="10" rx="5" fill="#d0b397"/>
      <circle cx="135" cy="132" r="45" fill="none" stroke="#a94920" stroke-width="12" stroke-dasharray="218 66" transform="rotate(-28 135 132)"/>
      <path d="M113 134c12-14 29-17 44-9 1 18-11 33-30 33-13 0-23-8-23-18 0-2 4-4 9-6z" fill="none" stroke="#62301d" stroke-width="7"/>
      <text x="135" y="208" text-anchor="middle" fill="#2a1b14" font-family="Arial Black,Arial" font-size="23" font-weight="900">QYNTRO DAILY</text>
      <text x="135" y="236" text-anchor="middle" fill="#6d402d" font-family="Arial" font-size="13" font-weight="700" letter-spacing="6">COFFEE</text>
      <text x="135" y="310" text-anchor="middle" fill="#5a2c19" font-family="Arial" font-size="19" font-weight="800">SMOOTH BLEND</text>
      <text x="135" y="338" text-anchor="middle" fill="#7e543e" font-family="Arial" font-size="14">Mild &amp; Clean</text>
      <text x="135" y="447" text-anchor="middle" fill="#6b432f" font-family="Arial" font-size="13">250g</text>
    </g>
