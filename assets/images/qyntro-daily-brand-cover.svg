      <rect x="25" y="35" width="318" height="12" rx="6" fill="#2c2823"/>
      <path d="M278 62c34 29 55 70 58 116M302 71c-14 22-27 48-33 78M307 102c-31-2-55 7-76 25" fill="none" stroke="#bf632f" stroke-width="4" opacity=".75"/>
      <circle cx="184" cy="176" r="58" fill="none" stroke="#c66a2e" stroke-width="15" stroke-dasharray="280 85" transform="rotate(-28 184 176)"/>
