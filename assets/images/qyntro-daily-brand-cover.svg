<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Qyntro Daily brand identity and packaging cover</title>
  <desc id="desc">Warm coffee brand presentation with Qyntro Daily identity, three packaging variants, and a coffee-inspired neutral palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171411"/>
      <stop offset="0.55" stop-color="#2b1a12"/>
      <stop offset="1" stop-color="#56301d"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a26e"/>
      <stop offset="1" stop-color="#b65725"/>
    </linearGradient>
    <linearGradient id="creamBag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ede1"/>
      <stop offset="1" stop-color="#ddc5a9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1.1" fill="#fff" opacity=".05"/>
      <circle cx="20" cy="18" r=".8" fill="#fff" opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grain)"/>
  <circle cx="1430" cy="115" r="250" fill="#c66a2e" opacity=".10"/>
  <circle cx="120" cy="920" r="320" fill="#ead9c6" opacity=".05"/>

  <g transform="translate(105 95)">
    <text x="0" y="0" fill="#d88a54" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="7">PERSONAL PROJECT · BRAND IDENTITY &amp; PACKAGING</text>
    <text x="0" y="116" fill="#fff8ef" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="108" font-weight="900" letter-spacing="3">QYNTRO DAILY</text>
    <text x="5" y="183" fill="#ead9c6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="14">COFFEE</text>
    <text x="5" y="246" fill="#d88a54" font-family="Georgia,serif" font-size="34" font-style="italic">Fuel your everyday.</text>
    <line x1="0" y1="291" x2="575" y2="291" stroke="#c66a2e" stroke-width="3" opacity=".72"/>
    <text x="0" y="342" fill="#d9c8b6" font-family="Arial,Helvetica,sans-serif" font-size="24">Warm identity · flexible packaging · lifestyle applications</text>
  </g>

  <g transform="translate(990 86)">
    <circle cx="108" cy="105" r="86" fill="none" stroke="url(#copper)" stroke-width="22" stroke-linecap="round" stroke-dasharray="440 120" transform="rotate(-24 108 105)"/>
    <path d="M69 108c24-28 55-35 84-20 2 34-23 63-59 62-24 0-42-15-43-35 0-3 7-6 18-7z" fill="none" stroke="#fff3e7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M95 76c-19-25 12-31 0-56M126 76c-20-27 15-35 5-62" fill="none" stroke="#e7854f" stroke-width="13" stroke-linecap="round"/>
    <path d="M157 102c24-3 35 10 27 29-6 16-23 22-42 16" fill="none" stroke="#fff3e7" stroke-width="13" stroke-linecap="round"/>
  </g>

