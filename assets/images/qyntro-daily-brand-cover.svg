      <path d="M174 155c-11-15 7-21 0-35M194 155c-12-16 9-23 3-39" fill="none" stroke="#e7854f" stroke-width="8" stroke-linecap="round"/>
      <text x="184" y="279" text-anchor="middle" fill="#fff8ef" font-family="Arial Black,Arial" font-size="34" font-weight="900">QYNTRO DAILY</text>
      <text x="184" y="318" text-anchor="middle" fill="#ead9c6" font-family="Arial" font-size="18" font-weight="700" letter-spacing="8">COFFEE</text>
      <text x="184" y="367" text-anchor="middle" fill="#d98953" font-family="Georgia" font-style="italic" font-size="18">Fuel your everyday.</text>
      <rect x="45" y="407" width="278" height="108" rx="12" fill="#1a1815" stroke="#c66a2e" stroke-width="2"/>
      <text x="184" y="450" text-anchor="middle" fill="#fff8ef" font-family="Arial" font-size="26" font-weight="800">DARK ROAST</text>
      <text x="184" y="484" text-anchor="middle" fill="#d9c8b6" font-family="Arial" font-size="17">Bold &amp; Rich</text>
      <text x="184" y="557" text-anchor="middle" fill="#ead9c6" font-family="Arial" font-size="16">250g · 100% Arabica Beans</text>
