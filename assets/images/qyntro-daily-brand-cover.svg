  <g transform="translate(110 740)">
    <text x="0" y="0" fill="#d88a54" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">VISUAL SYSTEM</text>
    <g transform="translate(0 38)">
      <rect width="88" height="88" rx="18" fill="#1e1a17" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="108" width="88" height="88" rx="18" fill="#3a2417" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="216" width="88" height="88" rx="18" fill="#c66a2e" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="324" width="88" height="88" rx="18" fill="#ead9c6" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="432" width="88" height="88" rx="18" fill="#f6f1e9" stroke="#ffffff" stroke-opacity=".12"/>
    </g>
    <text x="0" y="158" fill="#bda997" font-family="Arial" font-size="18">Charcoal · Coffee Brown · Copper · Cream · Light Beige</text>
  </g>

  <text x="1492" y="944" text-anchor="end" fill="#c4ad99" font-family="Arial" font-size="18">Brand guide · Packaging · Social · Applications</text>
