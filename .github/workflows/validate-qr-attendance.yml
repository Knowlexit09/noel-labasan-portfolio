name: Validate QR Attendance Demo
on:
  push:
    branches: [main]
    paths:
      - 'projects/qr-attendance/**'
      - 'projects/qr-attendance.html'
      - 'assets/images/qr-attendance-cover.svg'
      - '.github/workflows/validate-qr-attendance.yml'
  pull_request:
    paths:
      - 'projects/qr-attendance/**'
      - 'projects/qr-attendance.html'
      - 'assets/images/qr-attendance-cover.svg'
      - '.github/workflows/validate-qr-attendance.yml'
jobs:
  attendance-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML/JS/GAS source and simulated time clock
        run: node projects/qr-attendance/tests/verify.js