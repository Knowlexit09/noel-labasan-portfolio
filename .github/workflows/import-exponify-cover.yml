name: Import approved Exponify cover

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-exponify-cover.yml"

permissions:
  contents: write

jobs:
  import-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact approved cover
        env:
          COVER_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/197c5ec7-7d19-48de-8e4e-de879d08be36.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWQ2MTllNWVhMTc2NGYzMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTQ5MzcyNn0.ULl4cWafXTjThVROAEd8lazG4hfqAOJHeXk7haMLDHw"
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl --fail --location --retry 3 --output assets/images/exponify-ph-client-acquisition-cover.png "$COVER_URL"
          printf '%s  %s\n' "aca4f00204dc1c52f6d3103b2cfbb516fcaae47e35a4804f76275ab322cb92d1" "assets/images/exponify-ph-client-acquisition-cover.png" | sha256sum --check -
      - name: Commit approved cover asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/exponify-ph-client-acquisition-cover.png
          if git diff --cached --quiet; then
            echo "Approved cover already present."
            exit 0
          fi
          git commit -m "Add exact approved Exponify cover asset"
          git push origin HEAD:main
