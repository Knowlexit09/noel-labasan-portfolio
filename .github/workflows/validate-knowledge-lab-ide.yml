name: Validate Knowledge Lab IDE

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-knowledge-lab-ide.yml"
      - "knowledge/**"
      - "assets/js/knowledge-lab-*.js"

permissions:
  contents: write

jobs:
  ide-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local portfolio server
        run: |
          python3 -m http.server 4173 >/tmp/knowledge-lab-http.log 2>&1 &
          sleep 2
      - name: Diagnose IDE interaction
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          (async () => {
            const result = {
              passed: false,
              runnerStatusBeforeClick: null,
              runnerStatusAfterClick: null,
              jsLength: 0,
              jsPreview: '',
              resultMessage: null,
              parentConsoleCount: null,
              parentConsoleText: [],
              browserMessages: [],
              iframeUrl: null,
              iframeHtml: null
            };

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('console', msg => result.browserMessages.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => result.browserMessages.push('pageerror: ' + err.message));

            try {
              await page.goto('http://127.0.0.1:4173/knowledge/#html-accessible-form', { waitUntil: 'networkidle' });
              await page.waitForSelector('[data-result-frame]');
              const frameHandle = await page.$('[data-result-frame]');
              const frame = await frameHandle.contentFrame();
              await frame.waitForSelector('#helloForm');

              result.runnerStatusBeforeClick = await page.textContent('[data-run-status]');
              const jsEditor = await page.inputValue('[data-editor="js"]');
              result.jsLength = jsEditor.length;
              result.jsPreview = jsEditor.slice(0, 500);
              result.iframeUrl = frame.url();
              result.iframeHtml = (await frame.content()).slice(0, 3000);

              await frame.fill('#name', 'Juan Dela Cruz');
              await frame.click('button[type="submit"]');
              await page.waitForTimeout(300);
              result.resultMessage = await frame.textContent('#message');
              result.runnerStatusAfterClick = await page.textContent('[data-run-status]');
              result.parentConsoleCount = await page.textContent('[data-console-count]');
              result.parentConsoleText = await page.locator('[data-console-lines] li').allTextContents();

              result.passed = result.resultMessage === 'Hello, Juan Dela Cruz!';
            } catch (error) {
              result.error = String(error && error.stack || error);
            } finally {
              await browser.close();
            }

            fs.writeFileSync('knowledge-lab-e2e-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
          })();
          NODE
      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge-lab-e2e-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Knowledge Lab IDE browser diagnostic"
          git push origin HEAD:main
