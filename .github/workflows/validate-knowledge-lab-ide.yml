name: Validate Knowledge Lab IDE
# Knowledge Lab V3 regression gate

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-knowledge-lab-ide.yml"
      - "knowledge/**"
      - "assets/js/knowledge-lab-*.js"
      - "assets/css/knowledge-lab.css"
      - "assets/js/future-modules.js"
      - "admin/admin.js"
      - "admin/admin-creative-manager.js"

permissions:
  contents: read

jobs:
  ide-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Static syntax and structure checks
        run: |
          node --check assets/js/knowledge-lab-data.js
          node --check assets/js/knowledge-lab-i18n.js
          node --check assets/js/knowledge-lab-runner.js
          node --check assets/js/knowledge-lab-sandbox.js
          node --check assets/js/future-modules.js
          node --check admin/admin.js
          node --check admin/admin-creative-manager.js
          grep -q "link.href = 'knowledge/'" assets/js/future-modules.js
          ! grep -q 'section class="section knowledge-section"' assets/js/future-modules.js
          grep -q 'data-view="home"' knowledge/index.html
          grep -q 'data-proof-lab' knowledge/index.html
          grep -q 'data-reference-lab' knowledge/index.html
          grep -q 'data-quiz-lab' knowledge/index.html
          grep -q 'data-shortcut-lab' knowledge/index.html
          grep -q 'data-interactive-lab' knowledge/index.html

      - name: Validate lesson source and Java references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          global.window = {};
          require('./assets/js/knowledge-lab-data.js');
          require('./assets/js/knowledge-lab-i18n.js');
          const data = global.window.KNOWLEDGE_LAB_V2;
          const i18n = global.window.KNOWLEDGE_LAB_I18N;
          if (!data || !Array.isArray(data.categories) || !Array.isArray(data.lessons)) {
            throw new Error('Knowledge Lab V2 data is missing.');
          }

          const requiredCategories = ['html','css','javascript','java','photoshop','canva','capcut','blender'];
          for (const id of requiredCategories) {
            if (!data.categories.some(c => c.id === id)) throw new Error('Missing category: ' + id);
          }

          for (const lesson of data.lessons.filter(x => x.mode === 'code')) {
            new Function(lesson.js || '');
          }

          const quizLessons = data.lessons.filter(x => Array.isArray(x.quiz) && x.quiz.length);
          if (quizLessons.length < 6) throw new Error('Expected multiple quiz-backed lessons.');
          for (const lesson of quizLessons) {
            for (const question of lesson.quiz) {
              if (!Array.isArray(question.options) || question.options.length < 2) {
                throw new Error('Quiz options missing: ' + lesson.id);
              }
              if (!Number.isInteger(question.correctIndex) || !question.options[question.correctIndex]) {
                throw new Error('Invalid quiz correctIndex: ' + lesson.id);
              }
              if (!question.explanation) throw new Error('Quiz explanation missing: ' + lesson.id);
            }
          }

          if (!i18n?.languages?.tl || !i18n?.ui?.tl) {
            throw new Error('Curated Filipino language pack is missing.');
          }
          const curatedCssTl = Object.keys(i18n.lessons?.tl || {}).filter(id => id.startsWith('css-'));
          if (curatedCssTl.length < 15) {
            throw new Error('Expected at least 15 manually curated Filipino CSS lessons.');
          }
          if (!i18n.lessons.tl['css-what-is-css']?.definition?.includes('Cascading Style Sheets')) {
            throw new Error('Curated Filipino CSS definition is missing.');
          }

          const htmlCategory = data.categories.find(x => x.id === 'html');
          const htmlLessons = data.lessons.filter(x => x.categoryId === 'html');
          if (!htmlCategory?.learningPath || htmlLessons.length < 45) {
            throw new Error('Complete HTML learning path is missing.');
          }
          const requiredHtmlLessons = [
            'html-what-is-html',
            'html-document-anatomy',
            'html-elements-tags-attributes',
            'html-emmet-shortcuts',
            'html-semantic-landmarks',
            'html-images-alt',
            'html-accessible-form',
            'html-form-validation',
            'html-accessible-tables',
            'html-iframe-sandbox',
            'html-native-before-aria',
            'html-details-summary',
            'html-dialog',
            'html-title-description',
            'html-script-defer-async',
            'html-data-attributes',
            'html-template',
            'html-popover',
            'html-security-basics',
            'html-expert-practice-page'
          ];
          for (const id of requiredHtmlLessons) {
            const lesson = data.lessons.find(x => x.id === id);
            if (!lesson) throw new Error('Missing HTML lesson: ' + id);
            if (!lesson.definition || !Array.isArray(lesson.learn) || lesson.learn.length < 3) {
              throw new Error('HTML definition/learning goals missing: ' + id);
            }
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) {
              throw new Error('HTML quiz missing: ' + id);
            }
          }
          const htmlIntro = data.lessons.find(x => x.id === 'html-what-is-html');
          if (!htmlIntro?.definition?.includes('HyperText Markup Language')) {
            throw new Error('HTML definition is missing HyperText Markup Language.');
          }
          const htmlEmmet = data.lessons.find(x => x.id === 'html-emmet-shortcuts');
          if (!htmlEmmet?.shortcut?.shortCode?.includes('ul>li*3')) {
            throw new Error('HTML Emmet shortcut lesson is missing.');
          }
          const curatedHtmlTl = Object.keys(i18n.lessons?.tl || {}).filter(id => id.startsWith('html-'));
          if (curatedHtmlTl.length < 20) {
            throw new Error('Expected at least 20 manually curated Filipino HTML lessons.');
          }
          if (!i18n.lessons.tl['html-what-is-html']?.definition?.includes('HyperText Markup Language')) {
            throw new Error('Curated Filipino HTML definition is missing.');
          }

          const cssCategory = data.categories.find(x => x.id === 'css');
          const cssLessons = data.lessons.filter(x => x.categoryId === 'css');
          if (!cssCategory?.learningPath || cssLessons.length < 45) {
            throw new Error('Complete CSS learning path is missing.');
          }
          const requiredCssLessons = [
            'css-what-is-css',
            'css-box-model',
            'css-flexbox-basics',
            'css-grid-basics',
            'css-media-queries',
            'css-custom-properties',
            'css-container-queries',
            'css-keyframes-reduced-motion',
            'css-cascade-layers',
            'css-expert-practice-card-system',
            'css-why-cascading',
            'css-basic-selectors',
            'css-width-height-min-max',
            'css-flex-alignment',
            'css-grid-placement-areas',
            'css-subgrid',
            'css-mobile-first',
            'css-responsive-media',
            'css-nesting',
            'css-logical-properties',
            'css-supports-feature-queries',
            'css-form-controls',
            'css-tables',
            'css-focus-contrast-accessibility',
            'css-contain-content-visibility',
            'css-print-styles'
          ];
          for (const id of requiredCssLessons) {
            const lesson = data.lessons.find(x => x.id === id);
            if (!lesson) throw new Error('Missing CSS lesson: ' + id);
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) {
              throw new Error('CSS quiz missing: ' + id);
            }
          }

          const bigO = data.lessons.find(x => x.id === 'java-big-o-made-simple');
          if (!bigO?.interactive || bigO.interactive.type !== 'big-o-simulator') {
            throw new Error('Big O interactive lesson is missing.');
          }

          const shorthand = data.lessons.find(x => x.id === 'java-ternary-cleaner-conditions');
          if (!shorthand?.shortcut?.shortCode || !shorthand?.shortcut?.longCode) {
            throw new Error('Java shorthand comparison is missing.');
          }

          const javaLessons = data.lessons.filter(x => x.mode === 'reference' && x.language === 'Java' && x.verified);
          if (!javaLessons.length) throw new Error('No verified Java reference lessons found.');

          for (const lesson of javaLessons) {
            fs.mkdirSync('/tmp/kl-java', { recursive: true });
            fs.writeFileSync('/tmp/kl-java/Main.java', lesson.code);
            cp.execFileSync('javac', ['Main.java'], { cwd: '/tmp/kl-java', stdio: 'inherit' });
            const output = cp.execFileSync('java', ['Main'], { cwd: '/tmp/kl-java', encoding: 'utf8' }).trim();
            const expected = String(lesson.expectedOutput || '').trim();
            console.log(lesson.id + ': ' + JSON.stringify(output));
            if (output !== expected) {
              throw new Error(lesson.id + ' output mismatch. Expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(output));
            }
            for (const file of fs.readdirSync('/tmp/kl-java')) fs.rmSync('/tmp/kl-java/' + file, { force: true });
          }

          const proofLessons = data.lessons.filter(x => x.mode === 'proof');
          if (proofLessons.length < 3) throw new Error('Expected at least three proof-backed creative lessons.');
          for (const lesson of proofLessons) {
            if (!lesson.proof?.src || !lesson.proof?.caseUrl) throw new Error('Incomplete proof lesson: ' + lesson.id);
          }
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local portfolio server
        run: |
          python3 -m http.server 4173 >/tmp/knowledge-lab-http.log 2>&1 &
          sleep 2

      - name: Run browser interaction tests
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const browserMessages = [];
            page.on('console', msg => browserMessages.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => browserMessages.push('pageerror: ' + err.message));

            await page.goto('http://127.0.0.1:4173/knowledge/', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-view="home"]:not([hidden])');
            if (await page.locator('[data-code-lab]:visible').count()) {
              throw new Error('IDE should not open automatically on Knowledge Lab home.');
            }

            const categoryText = await page.locator('[data-category-groups]').innerText();
            for (const label of ['HTML','CSS','JavaScript','Java','Photoshop','Canva','CapCut','Blender']) {
              if (!categoryText.includes(label)) throw new Error('Missing category card: ' + label);
            }

            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="tl"]');
            const languageLabel = await page.textContent('[data-language-button-label]');
            if (languageLabel.trim() !== 'Filipino / Taglish') {
              throw new Error('Language switch did not select curated Filipino.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#category/html', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-view="category"]:not([hidden])');
            const htmlCategoryTextTl = await page.locator('[data-category-lessons]').innerText();
            for (const label of ['Ano ang HTML?','Emmet shortcuts','Gumawa ng usable form','Native HTML first, ARIA second','Final HTML challenge']) {
              if (!htmlCategoryTextTl.includes(label)) throw new Error('HTML learning path missing visible lesson: ' + label);
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/html-what-is-html', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-definition-lab]:not([hidden])');
            const htmlTitleTl = (await page.textContent('[data-title]')).trim();
            const htmlDefinitionTl = await page.textContent('[data-definition]');
            if (htmlTitleTl !== 'Ano ang HTML?') throw new Error('Curated Filipino HTML title did not render.');
            if (!htmlDefinitionTl.includes('HyperText Markup Language') || !htmlDefinitionTl.includes('Ang HTML ay ibig sabihin')) {
              throw new Error('Curated Filipino HTML definition did not render.');
            }
            if (!(await page.textContent('[data-language-status]')).includes('hindi auto-translate')) {
              throw new Error('Curated Filipino HTML status is missing.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/html-emmet-shortcuts', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-shortcut-lab]:not([hidden])');
            if (!(await page.textContent('[data-shortcut-short]')).includes('ul>li*3')) {
              throw new Error('HTML Emmet shortcut did not render.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/html-form-validation', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-language-status]:not([hidden])');
            if (!(await page.textContent('[data-language-status]')).includes('English source')) {
              throw new Error('Unreviewed Filipino HTML lesson must safely fall back to English.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#category/css', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-view="category"]:not([hidden])');
            const cssCategoryText = await page.locator('[data-category-lessons]').innerText();
            for (const label of ['Ano ang CSS?','Bakit “Cascading Style Sheets”','Basic selectors','Flexbox','CSS Grid','Subgrid','Container queries','Native CSS nesting','Style forms','CSS accessibility','Final CSS challenge']) {
              if (!cssCategoryText.includes(label)) throw new Error('CSS learning path missing visible lesson: ' + label);
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/css-what-is-css', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-definition-lab]:not([hidden])');
            const cssDefinition = await page.textContent('[data-definition]');
            const cssTitleTl = await page.textContent('[data-title]');
            if (cssTitleTl.trim() !== 'Ano ang CSS?') {
              throw new Error('Curated Filipino CSS title did not render.');
            }
            if (!cssDefinition.includes('Cascading Style Sheets') || !cssDefinition.includes('Ang CSS ay ibig sabihin')) {
              throw new Error('Curated Filipino CSS definition is not visibly rendered.');
            }
            const curatedStatus = await page.textContent('[data-language-status]');
            if (!curatedStatus.includes('hindi auto-translate')) {
              throw new Error('Curated-language status is missing.');
            }
            const learnList = await page.locator('[data-learn-list] li').count();
            if (learnList < 3) throw new Error('CSS fundamentals learning goals are missing.');
            let cssFrame = await (await page.$('[data-result-frame]')).contentFrame();
            await cssFrame.waitForSelector('.lesson-card');
            const headingColor = await cssFrame.$eval('h1', el => getComputedStyle(el).color);
            if (!headingColor || headingColor === 'rgb(0, 0, 0)') {
              throw new Error('CSS fundamentals lesson styles did not apply.');
            }
            await page.waitForSelector('[data-quiz-lab]:not([hidden])');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/css-container-queries', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-language-status]:not([hidden])');
            const fallbackStatus = await page.textContent('[data-language-status]');
            if (!fallbackStatus.includes('English source')) {
              throw new Error('Unreviewed Filipino lesson must fail safely to the English source.');
            }

            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="en"]');
            if ((await page.textContent('[data-language-button-label]')).trim() !== 'English') {
              throw new Error('Language switch did not return to English.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/html-accessible-form', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-result-frame]');
            let frame = await (await page.$('[data-result-frame]')).contentFrame();
            await frame.waitForSelector('#helloForm');

            const jsEditor = await page.inputValue('[data-editor="js"]');
            if (!jsEditor.includes('addEventListener("submit"')) {
              throw new Error('Expected submit handler is missing from JavaScript editor.');
            }

            await frame.fill('#name', 'Juan Dela Cruz');
            await frame.click('button[type="submit"]');
            await page.waitForTimeout(250);
            const message = await frame.textContent('#message');
            console.log('FORM_RESULT=' + message);
            if (message !== 'Hello, Juan Dela Cruz!') {
              throw new Error('Form interaction failed. Actual result: ' + message);
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/js-dom-counter', { waitUntil: 'networkidle' });
            frame = await (await page.$('[data-result-frame]')).contentFrame();
            await frame.waitForSelector('#add');
            await frame.click('#add');
            await page.waitForTimeout(150);
            const count = await frame.textContent('#count');
            console.log('COUNTER_RESULT=' + count);
            if (count !== '1') throw new Error('Counter interaction failed. Actual count: ' + count);

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-ternary-cleaner-conditions', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-shortcut-lab]:not([hidden])');
            const shortCode = await page.textContent('[data-shortcut-short]');
            if (!shortCode.includes('? "Available" : "Out of stock"')) {
              throw new Error('Java shorthand panel is not rendered.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-big-o-made-simple', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-interactive-lab]:not([hidden])');
            const bigOTextBefore = await page.textContent('[data-big-o-grid]');
            if (!bigOTextBefore.includes('Quadratic')) throw new Error('Big O simulator did not render.');
            await page.click('[data-big-o-preset="1000"]');
            const nValue = await page.textContent('[data-big-o-n]');
            if (nValue.trim() !== '1,000') throw new Error('Big O preset did not update.');

            await page.waitForSelector('[data-quiz-lab]:not([hidden])');
            const optionButtons = page.locator('[data-quiz-option]');
            if (await optionButtons.count() < 2) throw new Error('Quiz options did not render.');
            await optionButtons.nth(2).click();
            await page.click('[data-quiz-next]');
            const feedback = await page.textContent('[data-quiz-feedback]');
            if (!feedback.includes('Correct')) throw new Error('Quiz feedback did not mark the correct Big O answer.');
            await page.click('[data-quiz-next]');
            if (!(await page.textContent('[data-quiz-count]')).includes('Question 2')) {
              throw new Error('Quiz did not advance.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-bigdecimal-money', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            if (await page.locator('[data-code-lab]:visible').count()) {
              throw new Error('Java reference must not show a fake browser Run IDE.');
            }
            const javaOutput = await page.textContent('[data-reference-output]');
            if (javaOutput.trim() !== '436.50') throw new Error('Unexpected Java reference output.');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/canva-brand-system-qyntro', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('[data-proof-lab]:not([hidden])');
            const videoSrc = await page.getAttribute('[data-proof-media] video', 'src');
            if (!videoSrc || !videoSrc.includes('qyntro-daily-brand-identity-packaging')) {
              throw new Error('Qyntro proof video is not wired.');
            }

            console.log('BROWSER_MESSAGES=' + JSON.stringify(browserMessages));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
