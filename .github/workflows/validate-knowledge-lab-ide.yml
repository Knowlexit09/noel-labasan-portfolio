            if (!(await page.textContent('[data-quiz-count]')).includes('33')) throw new Error('Java exam reviewer 33-question counter missing.');
            if (!(await page.textContent('[data-reference-output]')).includes('Throwable: true')) throw new Error('Java reviewer reference output missing.');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="tl"]');
            if (!(await page.textContent('[data-title]')).includes('JAVA Exam Reviewer')) throw new Error('Filipino Java exam title missing.');
            if (!(await page.textContent('[data-quiz-question]')).includes('class sa Java')) throw new Error('Curated Filipino exam questions not selected.');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="en"]');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-review-modern-interface', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="tl"]');
            if (!(await page.textContent('[data-title]')).includes('Java Interface'))
              throw new Error('Curated Filipino Java title missing.');
            if (!(await page.textContent('[data-practice-prompt]')).includes('Palitan'))
              throw new Error('Curated Filipino Java challenge missing.');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="en"]');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-jdbc-preparedstatement', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            if (!(await page.textContent('[data-definition]')).includes('PreparedStatement'))
              throw new Error('PreparedStatement lesson failed to load.');
            if (await page.locator('[data-java-ide-frame] iframe').count())
              throw new Error('External Java compiler loaded before consent.');

            // Separate manually authored Taglish definition from English fallback
            // without changing the verified code or the optional Java IDE.
            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-jdbc-transaction', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-definition]');
            const originalDefinition = await page.textContent('[data-definition]');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="tl"]');
            const taglishDefinition = await page.textContent('[data-definition]');
            if (!taglishDefinition.includes('Ang JDBC transaction') ||
                taglishDefinition === originalDefinition) {
              throw new Error('JDBC transaction Taglish definition is missing.');
            }
            if (!(await page.textContent('[data-language-status]')).includes('Taglish na ang kahulugan')) {
              throw new Error('Partially translated lesson falsely marked as fully curated.');
            }
            if (await page.locator('[data-java-ide-frame] iframe').count())
              throw new Error('Changing definition language loaded an external compiler.');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="en"]');
            if ((await page.textContent('[data-definition]')) !== originalDefinition) {
              throw new Error('Switching back to English did not restore original definition.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-what-is-java', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            await page.waitForSelector('[data-reference-lab] [data-java-ide]:not([hidden])');
            if ((await page.textContent('[data-reference-output]')).trim() !== 'Hello from Java')
              throw new Error('Original Java reference output missing.');
            if (await page.locator('[data-code-lab]:visible').count())
              throw new Error('Java reference exposed an incorrect first-party JavaScript runner.');
            const layout = await page.locator('[data-reference-lab]').evaluate(node => ({
              children: Array.from(node.children).map(child => child.className),
              hasOriginalSource: !!node.querySelector('[data-reference-code]'),
              hasOriginalOutput: !!node.querySelector('[data-reference-output]')
            }));
            if (!layout.children.some(name => name.includes('kl-java-ide')) ||
                !layout.hasOriginalSource || !layout.hasOriginalOutput)
              throw new Error('Checkpoint Java IDE should be inside the reference section below source and expected output.');
            if (await page.locator('[data-java-ide-frame] iframe').count())
              throw new Error('The old Java IDE must not automatically load a third-party compiler.');
            if (!(await page.locator('[data-java-ide-open]').isVisible()) ||
                !(await page.locator('[data-java-ide-reset]').isVisible()) ||
                !(await page.locator('[data-java-ide-sync]').isDisabled()) ||
                await page.locator('[data-java-ide-close]').isVisible())
              throw new Error('Original Java Open/Sync/Reset/Close state not restored.');
            if (await page.locator('[data-java-ide-run]').count())
              throw new Error('The later two-column Java Run toolbar must not replace the original checkpoint IDE.');
            await page.fill('[data-java-ide-source]', 'public class Main { public static void main(String[] a) { System.out.println("Edited Java"); } }');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="tl"]');
            if (!(await page.inputValue('[data-java-ide-source]')).includes('Edited Java'))
              throw new Error('Translation erased the Java draft.');
            await page.click('[data-language-toggle]');
            await page.click('[data-language-option="en"]');
            if (await page.locator('[data-java-ide-frame] iframe').count())
              throw new Error('Language changes must not implicitly contact OneCompiler.');
            await page.click('[data-java-ide-open]');
            const externalJavaFrame = page.frameLocator('[data-java-ide-frame] iframe');
            await externalJavaFrame.locator('#ready').waitFor();
            await externalJavaFrame.locator('body[data-code*="Edited Java"]').waitFor({ timeout: 5000 });
            if ((await externalJavaFrame.locator('body').getAttribute('data-language')) !== 'java')
              throw new Error('Old Java IDE did not sync Java source.');
            await page.fill('[data-java-ide-source]', 'public class Main { public static void main(String[] a) { System.out.println("Updated Java"); } }');
            await page.click('[data-java-ide-sync]');
            await externalJavaFrame.locator('body[data-code*="Updated Java"]').waitFor({ timeout: 5000 });
            await page.click('[data-java-ide-reset]');
            if (!(await page.inputValue('[data-java-ide-source]')).includes('Hello from Java'))
              throw new Error('Reset did not restore original source.');
            await page.click('[data-java-ide-close]');
            if (await page.locator('[data-java-ide-frame] iframe').count())
              throw new Error('Close did not remove the optional compiler frame.');
            if (!(await page.locator('[data-java-ide-open]').isVisible()))
              throw new Error('Open Java IDE should be usable after Close.');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-inheritance-polymorphism', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            if (await page.locator('[data-code-lab]:visible').count()) throw new Error('Fake Java browser runner appeared.');
            if ((await page.textContent('[data-reference-output]')).trim() !== '80') throw new Error('Java inheritance expected output mismatch.');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-first-program', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            await page.waitForSelector('[data-practice-lab]:not([hidden])');
            if (await page.locator('[data-code-lab]:visible').count()) {
              throw new Error('CI-tested Java examples must not display a fake browser Run IDE.');
            }
            if ((await page.textContent('[data-reference-output]')).trim() !== 'Liempo: 375\nAvailable: true') {
              throw new Error('Java first-program reference output mismatch.');
            }

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/java-bigdecimal-money', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-reference-lab]:not([hidden])');
            if (await page.locator('[data-code-lab]:visible').count()) {
              throw new Error('Java reference must not show a fake browser Run IDE.');
            }
            const javaOutput = await page.textContent('[data-reference-output]');
            if (javaOutput.trim() !== '436.50') throw new Error('Unexpected Java reference output.');

            await page.goto('http://127.0.0.1:4173/knowledge/#lesson/canva-brand-system-qyntro', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('[data-proof-lab]:not([hidden])');
            const videoSrc = await page.getAttribute('[data-proof-media] video', 'src');
            if (!videoSrc || !videoSrc.includes('qyntro-daily-brand-identity-packaging')) {
              throw new Error('Qyntro proof video is not wired.');
            }

            console.log('BROWSER_MESSAGES=' + JSON.stringify(browserMessages));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
