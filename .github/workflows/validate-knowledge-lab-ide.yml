name: Validate Knowledge Lab IDE

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-knowledge-lab-ide.yml"
      - "knowledge/**"
      - "assets/js/knowledge-lab-*.js"

permissions:
  contents: read

jobs:
  ide-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local portfolio server
        run: |
          python3 -m http.server 4173 >/tmp/knowledge-lab-http.log 2>&1 &
          sleep 2
      - name: Run browser interaction tests
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const browserMessages = [];
            page.on('console', msg => browserMessages.push(msg.type() + ': ' + msg.text()));
            page.on('pageerror', err => browserMessages.push('pageerror: ' + err.message));

            await page.goto('http://127.0.0.1:4173/knowledge/#html-accessible-form', { waitUntil: 'networkidle' });
            await page.waitForSelector('[data-result-frame]');
            let frame = await (await page.$('[data-result-frame]')).contentFrame();
            await frame.waitForSelector('#helloForm');

            const jsEditor = await page.inputValue('[data-editor="js"]');
            if (!jsEditor.includes('addEventListener("submit"')) {
              throw new Error('Expected submit handler is missing from the JavaScript editor.');
            }

            await frame.fill('#name', 'Juan Dela Cruz');
            await frame.click('button[type="submit"]');
            await page.waitForTimeout(250);

            const message = await frame.textContent('#message');
            console.log('FORM_RESULT=' + message);
            if (message !== 'Hello, Juan Dela Cruz!') {
              throw new Error('Form interaction failed. Actual result: ' + message);
            }

            await page.click('[data-lesson-id="js-dom-counter"]');
            await page.waitForTimeout(350);
            frame = await (await page.$('[data-result-frame]')).contentFrame();
            await frame.waitForSelector('#add');
            await frame.click('#add');
            await page.waitForTimeout(150);

            const count = await frame.textContent('#count');
            console.log('COUNTER_RESULT=' + count);
            if (count !== '1') {
              throw new Error('Counter interaction failed. Actual count: ' + count);
            }

            const status = await page.textContent('[data-run-status]');
            console.log('RUN_STATUS=' + status);
            console.log('BROWSER_MESSAGES=' + JSON.stringify(browserMessages));

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
