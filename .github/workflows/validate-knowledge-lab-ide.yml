name: Validate Knowledge Lab IDE
# Knowledge Lab V3 regression gate

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-knowledge-lab-ide.yml"
      - "knowledge/**"
      - "scripts/verify-knowledge-lab-js-examples.cjs"
      - "scripts/verify-knowledge-lab-java.cjs"
      - "assets/js/knowledge-lab-*.js"
      - "assets/css/knowledge-lab.css"
      - "assets/js/future-modules.js"
      - "admin/admin.js"
      - "admin/admin-creative-manager.js"

permissions:
  contents: read

jobs:
  ide-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Static syntax and structure checks
        run: |
          node --check assets/js/knowledge-lab-data.js
          node --check assets/js/knowledge-lab-javascript-foundations.js
          node --check assets/js/knowledge-lab-javascript-intermediate.js
          node --check assets/js/knowledge-lab-js-core-expansion.js
          node --check assets/js/knowledge-lab-js-collections-quality.js
          node --check assets/js/knowledge-lab-js-projects.js
          node --check assets/js/knowledge-lab-javascript-deep-dive.js
          node --check assets/js/knowledge-lab-javascript-dom-practice.js
          node --check assets/js/knowledge-lab-js-quality-practice.js
          node --check scripts/verify-knowledge-lab-js-examples.cjs
          node --check scripts/verify-knowledge-lab-java.cjs
          node scripts/verify-knowledge-lab-js-examples.cjs
          node --check assets/js/knowledge-lab-java-foundations.js
          node --check assets/js/knowledge-lab-java-core-expansion.js
          node --check assets/js/knowledge-lab-java-modern-expansion.js
          node --check assets/js/knowledge-lab-java-intro.js
          node --check assets/js/knowledge-lab-java-professional.js
          node --check assets/js/knowledge-lab-java-applied.js
          node --check assets/js/knowledge-lab-java-exam-fundamentals.js
          node --check assets/js/knowledge-lab-java-design-jdbc.js
          node --check assets/js/knowledge-lab-java-exam-reviewer.js
          node --check assets/js/knowledge-lab-java-capstone-projects.js
          node --check assets/js/knowledge-lab-java-review-tl.js
          node --check assets/js/knowledge-lab-java-exam-reviewer-tl.js
          node --check assets/js/knowledge-lab-java-definitions-tl.js
          node --check assets/js/knowledge-lab-javascript-tl.js
          node --check assets/js/knowledge-lab-js-quality-tl.js
          node --check assets/js/knowledge-lab-i18n.js
          node --check assets/js/knowledge-lab-runner.js
          node --check assets/js/knowledge-lab-java-ide.js
          node --check assets/js/knowledge-lab-sandbox.js
          node --check assets/js/future-modules.js
          node --check admin/admin.js
          node --check admin/admin-creative-manager.js
          grep -q "link.href = 'knowledge/'" assets/js/future-modules.js
          ! grep -q 'section class="section knowledge-section"' assets/js/future-modules.js
          grep -q 'data-view="home"' knowledge/index.html
          grep -q 'data-proof-lab' knowledge/index.html
          grep -q 'data-reference-lab' knowledge/index.html
          grep -q 'data-java-ide-open' knowledge/index.html
          grep -q 'data-java-ide-source' knowledge/index.html
          grep -q 'data-java-ide-sync' knowledge/index.html
          grep -q 'data-java-ide-reset' knowledge/index.html
          grep -q 'frame-src .*https://onecompiler.com' knowledge/index.html
          grep -q 'data-quiz-lab' knowledge/index.html
          grep -q 'data-practice-lab' knowledge/index.html
          grep -q 'data-practice-prompt' knowledge/index.html
          grep -q 'data-shortcut-lab' knowledge/index.html
          grep -q 'data-interactive-lab' knowledge/index.html

      - name: Validate lesson source and Java references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          global.window = {};
          require('./assets/js/knowledge-lab-data.js');
          require('./assets/js/knowledge-lab-javascript-foundations.js');
          require('./assets/js/knowledge-lab-javascript-intermediate.js');
          require('./assets/js/knowledge-lab-js-core-expansion.js');
          require('./assets/js/knowledge-lab-js-collections-quality.js');
          require('./assets/js/knowledge-lab-js-projects.js');
          require('./assets/js/knowledge-lab-javascript-deep-dive.js');
          require('./assets/js/knowledge-lab-javascript-dom-practice.js');
          require('./assets/js/knowledge-lab-js-quality-practice.js');
          require('./assets/js/knowledge-lab-java-foundations.js');
          require('./assets/js/knowledge-lab-java-core-expansion.js');
          require('./assets/js/knowledge-lab-java-modern-expansion.js');
          require('./assets/js/knowledge-lab-java-intro.js');
          require('./assets/js/knowledge-lab-java-professional.js');
          require('./assets/js/knowledge-lab-java-applied.js');
          require('./assets/js/knowledge-lab-java-exam-fundamentals.js');
          require('./assets/js/knowledge-lab-java-design-jdbc.js');
          require('./assets/js/knowledge-lab-java-exam-reviewer.js');
          require('./assets/js/knowledge-lab-java-capstone-projects.js');
          require('./assets/js/knowledge-lab-i18n.js');
          require('./assets/js/knowledge-lab-javascript-tl.js');
          require('./assets/js/knowledge-lab-js-quality-tl.js');
          require('./assets/js/knowledge-lab-java-review-tl.js');
          require('./assets/js/knowledge-lab-java-exam-reviewer-tl.js');
          require('./assets/js/knowledge-lab-java-definitions-tl.js');
          const data = global.window.KNOWLEDGE_LAB_V2;
          const i18n = global.window.KNOWLEDGE_LAB_I18N;
          if (!data || !Array.isArray(data.categories) || !Array.isArray(data.lessons)) {
            throw new Error('Knowledge Lab V2 data is missing.');
          }

          const requiredCategories = ['html','css','javascript','java','photoshop','canva','capcut','blender'];
          for (const id of requiredCategories) {
            if (!data.categories.some(c => c.id === id)) throw new Error('Missing category: ' + id);
          }

          for (const lesson of data.lessons.filter(x => x.mode === 'code')) {
            new Function(lesson.js || '');
          }

          const jsFoundations = data.lessons.filter(x => x.categoryId === 'javascript');
          if (jsFoundations.length !== 61) throw new Error('Expected 61 JavaScript lessons, got ' + jsFoundations.length);
          const requiredJavaScript = ['js-first-steps', 'js-variables-types', 'js-conditions', 'js-functions', 'js-loops',
            'js-arrays-foundation', 'js-objects-properties', 'js-map-reduce', 'js-form-input-validation',
            'js-event-delegation', 'js-promises-async-await', 'js-debugging-errors', 'js-project-live-product-search',
            'js-statements-comments','js-arithmetic-precedence','js-strict-equality','js-boolean-logic','js-switch-cases',
            'js-nullish-defaults','js-while-loop','js-string-search-methods','js-number-input-conversion','js-lexical-closure',
            'js-array-slice-splice','js-array-sort-safely','js-set-unique-values','js-map-keyed-lookup',
            'js-object-destructuring','js-json-basics','js-classes-constructor','js-promise-all',
            'js-try-catch','js-safe-text-rendering','js-project-stock-cart','js-project-accessible-tabs',
            'js-callback-values','js-recursion-base-case','js-spread-immutable-update','js-some-every','js-regex-test','js-utc-date','js-bigint-integers','js-prototype-lookup','js-extends-super','js-generators-yield','js-allsettled','js-microtask-order','js-freeze-shallow','js-this-binding',
            'js-dom-selectors','js-classlist-pressed','js-createelement-list','js-event-bubbling','js-remove-event-listener','js-formdata-submit','js-escape-search-key','js-focus-management',
            'js-quality-unit-tests','js-async-debounced-filter'];
          const requiredJavaScriptStages = ['Foundation', 'Operators & Decisions', 'Strings & Numbers', 'Functions & Scope', 'Arrays', 'Objects & Data', 'DOM & Forms', 'Asynchronous Thinking', 'Projects & Practice'];
          const jsCategory = data.categories.find(x => x.id === 'javascript');
          if (!jsCategory || requiredJavaScriptStages.some(stage => !jsCategory.learningPath?.includes(stage))) {
            throw new Error('JavaScript learning path stages missing.');
          }
          for (const id of requiredJavaScript) {
            const lesson = jsFoundations.find(x => x.id === id);
            if (!lesson || !lesson.definition || lesson.learn?.length < 3 || !lesson.expected || !lesson.realUse || !Array.isArray(lesson.quiz) || lesson.quiz.length < 2) throw new Error('Incomplete JavaScript lesson: ' + id);
            new Function(lesson.js);
          }
          for (const lesson of jsFoundations) {
            if (!lesson.practice?.prompt || !lesson.practice?.check) {
              throw new Error('Missing Learn Practice Apply challenge: ' + lesson.id);
            }
          }
          for (const id of ['js-first-steps', 'js-variables-types', 'js-form-input-validation']) {
            const curated = i18n.lessons?.tl?.[id];
            if (!curated?.title || !curated?.definition || !curated?.practice?.prompt ||
                !curated?.practice?.check || curated.quiz?.length < 2) {
              throw new Error('Manually reviewed Filipino JavaScript lesson incomplete: ' + id);
            }
          }
          if (!i18n.lessons.tl['js-first-steps'].definition.includes('Ang JavaScript ay')) {
            throw new Error('Curated Filipino JavaScript definition not rendered from source.');
          }
          for (const id of ['js-quality-unit-tests', 'js-async-debounced-filter']) {
            const localized = i18n.lessons?.tl?.[id];
            if (!localized?.title || !localized.definition || !localized.explanation ||
                !localized.practice?.prompt || localized.learn?.length < 3 ||
                !Array.isArray(localized.quiz) || localized.quiz.length < 2 ||
                localized.quiz.some(q => !q.options?.[q.correctIndex] || !q.explanation)) {
              throw new Error('Incomplete original Filipino JavaScript quality lesson: ' + id);
            }
          }
          const quizLessons = data.lessons.filter(x => Array.isArray(x.quiz) && x.quiz.length);
          if (quizLessons.length < 6) throw new Error('Expected multiple quiz-backed lessons.');
          for (const lesson of quizLessons) {
            for (const question of lesson.quiz) {
              if (!Array.isArray(question.options) || question.options.length < 2) {
                throw new Error('Quiz options missing: ' + lesson.id);
              }
              if (!Number.isInteger(question.correctIndex) || !question.options[question.correctIndex]) {
                throw new Error('Invalid quiz correctIndex: ' + lesson.id);
              }
              if (!question.explanation) throw new Error('Quiz explanation missing: ' + lesson.id);
            }
          }

          if (!i18n?.languages?.tl || !i18n?.ui?.tl) {
            throw new Error('Curated Filipino language pack is missing.');
          }
          const curatedCssTl = Object.keys(i18n.lessons?.tl || {}).filter(id => id.startsWith('css-'));
          if (curatedCssTl.length < 15) {
            throw new Error('Expected at least 15 manually curated Filipino CSS lessons.');
          }
          if (!i18n.lessons.tl['css-what-is-css']?.definition?.includes('Cascading Style Sheets')) {
            throw new Error('Curated Filipino CSS definition is missing.');
          }

          const completeTeachingFields = ['definition','objective','explanation','tip','hack','mistake','expected','realUse'];
          for (const lesson of data.lessons) {
            const missing = completeTeachingFields.filter(key => !lesson[key]);
            if (!Array.isArray(lesson.learn) || lesson.learn.length < 3) missing.push('learn');
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) missing.push('quiz');
            if (missing.length) {
              throw new Error('Published lesson is incomplete: ' + lesson.id + ' -> ' + missing.join(', '));
            }
          }

          const htmlCategory = data.categories.find(x => x.id === 'html');
          const htmlLessons = data.lessons.filter(x => x.categoryId === 'html');
          if (!htmlCategory?.learningPath || htmlLessons.length < 45) {
            throw new Error('Complete HTML learning path is missing.');
          }
          const requiredHtmlLessons = [
            'html-what-is-html',
            'html-document-anatomy',
            'html-elements-tags-attributes',
            'html-emmet-shortcuts',
            'html-semantic-landmarks',
            'html-images-alt',
            'html-accessible-form',
            'html-form-validation',
            'html-accessible-tables',
            'html-iframe-sandbox',
            'html-native-before-aria',
            'html-details-summary',
            'html-dialog',
            'html-title-description',
            'html-script-defer-async',
            'html-data-attributes',
            'html-template',
            'html-popover',
            'html-security-basics',
            'html-expert-practice-page'
          ];
          for (const id of requiredHtmlLessons) {
            const lesson = data.lessons.find(x => x.id === id);
            if (!lesson) throw new Error('Missing HTML lesson: ' + id);
            if (!lesson.definition || !Array.isArray(lesson.learn) || lesson.learn.length < 3) {
              throw new Error('HTML definition/learning goals missing: ' + id);
            }
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) {
              throw new Error('HTML quiz missing: ' + id);
            }
          }
          const htmlIntro = data.lessons.find(x => x.id === 'html-what-is-html');
          if (!htmlIntro?.definition?.includes('HyperText Markup Language')) {
            throw new Error('HTML definition is missing HyperText Markup Language.');
          }
          const htmlEmmet = data.lessons.find(x => x.id === 'html-emmet-shortcuts');
          if (!htmlEmmet?.shortcut?.shortCode?.includes('ul>li*3')) {
            throw new Error('HTML Emmet shortcut lesson is missing.');
          }
          const curatedHtmlTl = Object.keys(i18n.lessons?.tl || {}).filter(id => id.startsWith('html-'));
          if (curatedHtmlTl.length < 20) {
            throw new Error('Expected at least 20 manually curated Filipino HTML lessons.');
          }
          if (!i18n.lessons.tl['html-what-is-html']?.definition?.includes('HyperText Markup Language')) {
            throw new Error('Curated Filipino HTML definition is missing.');
          }

          const cssCategory = data.categories.find(x => x.id === 'css');
          const cssLessons = data.lessons.filter(x => x.categoryId === 'css');
          if (!cssCategory?.learningPath || cssLessons.length !== 176) {
            throw new Error('Expected exactly 176 focused CSS course lessons, got ' + cssLessons.length);
          }
          for (const lesson of cssLessons) {
            if (!lesson.definition || !Array.isArray(lesson.learn) || lesson.learn.length < 3) {
              throw new Error('CSS definition/learning goals missing: ' + lesson.id);
            }
            if (!lesson.explanation || !lesson.tip || !lesson.hack || !lesson.mistake || !lesson.expected || !lesson.realUse) {
              throw new Error('CSS teaching fields missing: ' + lesson.id);
            }
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) {
              throw new Error('CSS quiz missing: ' + lesson.id);
            }
          }
          const cssReferenceCategory = data.categories.find(x => x.id === 'css-reference');
          const cssReferences = data.lessons.filter(x => x.categoryId === 'css-reference');
          if (!cssReferenceCategory?.learningPath || cssReferences.length !== 20) {
            throw new Error('Expected 20 CSS reference pages, got ' + cssReferences.length);
          }
          const requiredCssLessons = [
            'css-what-is-css',
            'css-box-model',
            'css-flexbox-basics',
            'css-grid-basics',
            'css-media-queries',
            'css-custom-properties',
            'css-container-queries',
            'css-keyframes-reduced-motion',
            'css-cascade-layers',
            'css-expert-practice-card-system',
            'css-why-cascading',
            'css-basic-selectors',
            'css-width-height-min-max',
            'css-flex-alignment',
            'css-grid-placement-areas',
            'css-subgrid',
            'css-mobile-first',
            'css-responsive-media',
            'css-nesting',
            'css-logical-properties',
            'css-supports-feature-queries',
            'css-form-controls',
            'css-tables',
            'css-focus-contrast-accessibility',
            'css-contain-content-visibility',
            'css-print-styles',
            'css-color-codes-explorer',
            'css-color-keywords',
            'css-rgb-alpha',
            'css-margin-collapse',
            'css-stacking-context',
            'css-auto-fill-fit',
            'css-object-fit-position',
            'css-3d-transforms',
            'css-scroll-snap',
            'css-at-property',
            'css-forced-colors',
            'css-project-profile-card',
            'css-project-product-grid',
            'css-project-dashboard',
            'css-project-final-design-system',
            'css-errors-parser-recovery',
            'css-grouping-selector-lists',
            'css-import-stylesheet-order',
            'css-inheritance-keywords',
            'css-important',
            'css-background-origin-clip-shorthand',
            'css-modern-color-spaces',
            'css-color-mix-light-dark',
            'css-box-shadow-focused',
            'css-border-image',
            'css-font-face',
            'css-overflow-wrap-word-break-hyphens',
            'css-writing-mode',
            'css-text-wrap',
            'css-line-clamp',
            'css-list-style-marker',
            'css-generated-content',
            'css-focus-state-selectors',
            'css-form-state-selectors',
            'css-centering-patterns',
            'css-flow-root',
            'css-multicolumn',
            'css-navbar-pattern',
            'css-dropdown-pattern',
            'css-tooltips',
            'css-buttons-groups',
            'css-pagination',
            'css-counters',
            'css-counter-style',
            'css-image-gallery',
            'css-image-sprites',
            'css-shape-outside',
            'css-resize-caret',
            'css-dynamic-viewport-units',
            'css-user-preference-media',
            'css-starting-style',
            'css-transition-behavior',
            'css-scroll-driven-animation',
            'css-view-transitions',
            'css-anchor-positioning',
            'css-field-sizing',
            'css-reset-strategy',
            'css-utility-architecture',
            'css-website-layout-pattern'
          ];
          for (const id of requiredCssLessons) {
            const lesson = data.lessons.find(x => x.id === id);
            if (!lesson) throw new Error('Missing CSS lesson: ' + id);
            if (!Array.isArray(lesson.quiz) || lesson.quiz.length < 2) {
              throw new Error('CSS quiz missing: ' + id);
            }
          }

          const bigO = data.lessons.find(x => x.id === 'java-big-o-made-simple');
          if (!bigO?.interactive || bigO.interactive.type !== 'big-o-simulator') {
            throw new Error('Big O interactive lesson is missing.');
          }

          const shorthand = data.lessons.find(x => x.id === 'java-ternary-cleaner-conditions');
          if (!shorthand?.shortcut?.shortCode || !shorthand?.shortcut?.longCode) {
            throw new Error('Java shorthand comparison is missing.');
          }

          const curatedJavaIds = ['java-review-class-instance','java-review-modern-interface',
            'java-review-exception-tree','java-review-checked','java-review-unchecked','java-pattern-dao',
            'java-principle-srp','java-principle-dry','java-jdbc-preparedstatement',
            'java-review-autocloseable','java-jdbc-resource-lifecycle'];
          for (const id of curatedJavaIds) {
            const version = i18n.lessons?.tl?.[id];
            if (!version || !version.definition || !version.explanation ||
              version.learn?.length < 3 || version.quiz?.length < 2 || !version.practice?.check) {
              throw new Error('Curated Filipino Java reviewer is incomplete: ' + id);
            }
          }
          if (!i18n.lessons.tl['java-review-exception-tree'].definition.includes('Throwable')) {
            throw new Error('Filipino Java exception hierarchy terminology is incorrect.');
          }

          const javaCategory = data.categories.find(x => x.id === 'java');
          if (!['Foundation','Control Flow','Strings & Arrays','Collections','OOP Foundations','OOP Advanced','Design Principles','Exceptions & IO','Database & JDBC','Modern Java','Problem Solving','Applied Java','Concurrency & JVM','Testing & Delivery']
            .every(stage => javaCategory?.learningPath?.includes(stage))) throw new Error('Java stages missing.');
          const requiredJavaIds = ['java-first-program','java-if-and-for','java-methods-and-contracts','java-arraylist-hashmap',
            'java-types-casting','java-string-immutability','java-array-basics','java-switch-expression',
            'java-constructors-encapsulation','java-inheritance-polymorphism','java-interfaces-abstraction',
            'java-exceptions-cleanup','java-generics-list','java-stream-filter-map',
            'java-method-overloading','java-recursion-base-case','java-stringbuilder','java-enum-states',
            'java-comparator-sort','java-record-introduction','java-optional-values',
            'java-bigdecimal-rounding','java-time-localdate','java-try-with-resources',
            'java-what-is-java','java-jdk-jvm-jre',
            'java-static-final','java-string-formatting','java-multidimensional-arrays','java-equals-hashcode','java-set-deduplication','java-files-utf8','java-path-normalization','java-lambda-predicate','java-method-references','java-collectors-joining','java-thread-join','java-completablefuture','java-virtual-thread-executor','java-assertion-tests',
            'java-composition','java-abstract-methods','java-generic-method','java-immutable-collections','java-pattern-sku','java-grouping-report','java-timezone-conversion','java-project-inventory-cli',
            'java-review-class-instance','java-review-primitives-wrappers','java-review-references-null','java-review-widening-narrowing','java-review-naming','java-review-constructors','java-review-method-signatures','java-review-this-super','java-review-modifiers','java-review-inheritance-types','java-review-modern-interface','java-review-exception-tree','java-review-checked','java-review-unchecked','java-review-try-catch-finally','java-review-autocloseable','java-review-suppressed','java-pattern-dao','java-pattern-dto-pojo','java-principle-srp','java-principle-dry','java-principle-ocp','java-principle-lsp','java-principle-isp','java-principle-dip','java-design-cohesion-coupling','java-design-association','java-design-dependency-injection','java-design-instanceof','java-jdbc-preparedstatement','java-jdbc-resource-lifecycle','java-jdbc-safe-sql','java-jdbc-transaction',
            'java-project-dao-crud','java-project-resource-close-order',
            'java-project-solid-checkout','java-project-atomic-stock'];
          for (const id of requiredJavaIds) {
            const lesson = data.lessons.find(x => x.id === id);
            if (!lesson || lesson.mode !== 'reference' || lesson.language !== 'Java' || !lesson.verified
              || !lesson.code || !lesson.expectedOutput || !lesson.practice?.prompt || !lesson.practice?.check
              || lesson.quiz?.length < 2) throw new Error('Incomplete verified Java 21 lesson: ' + id);
          }
          const tlExam = i18n.lessons?.tl?.['java-exam-reviewer-master-quiz'];
          if (!tlExam || tlExam.quiz?.length !== 33 || !tlExam.practice?.check ||
              tlExam.learn?.length < 3 || !tlExam.explanation) {
            throw new Error('33-item manually curated Filipino Java exam is missing.');
          }
          const tlCorrectPositions = [0,1,2].map(i => tlExam.quiz.filter(q => q.correctIndex === i).length);
          if (tlCorrectPositions.some(count => count !== 11)) {
            throw new Error('Filipino Java reviewer answer positions should be balanced.');
          }
          for (const q of tlExam.quiz) {
            if (!q.question || !q.options?.[q.correctIndex] || !q.explanation)
              throw new Error('Incomplete Filipino Java exam answer explanation.');
          }
          const reviewer = data.lessons.find(x => x.id === 'java-exam-reviewer-master-quiz');
          if (!reviewer || reviewer.stage !== 'Testing & Delivery' || reviewer.quiz?.length !== 33) {
            throw new Error('The 33-question Java exam reviewer is missing or incomplete.');
          }
          for (const question of reviewer.quiz) {
            if (!question.question || !Array.isArray(question.options) ||
              !question.options[question.correctIndex] || !question.explanation) {
              throw new Error('Incomplete Java exam reviewer answer explanation.');
            }
          }
          const javaLessons = data.lessons.filter(x => x.mode === 'reference' && x.language === 'Java' && x.verified);
          if (javaLessons.length < 91) throw new Error('Missing Java 21 references.');
          for (const lesson of javaLessons) {
            if (!lesson.practice?.prompt || !lesson.practice?.check) {
              throw new Error('Java lesson lacks an actionable practice challenge: ' + lesson.id);
            }
          }
          if (!javaLessons.length) throw new Error('No verified Java reference lessons found.');
          // Every Java definition must be authored in Filipino / Taglish. A definition-only
          // patch must not be advertised as a completely translated lesson.
          let definitionOnlyCount = 0;
          for (const lesson of javaLessons) {
            const version = i18n.lessons?.tl?.[lesson.id];
            if (!version?.definition || version.definition === lesson.definition) {
              throw new Error('Missing distinct Taglish Java definition: ' + lesson.id);
            }
            if (version.translationCoverage === 'definition-only') {
              definitionOnlyCount++;
              if (version.title || version.explanation || version.quiz) {
